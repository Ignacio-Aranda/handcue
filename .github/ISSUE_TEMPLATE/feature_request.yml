name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what is missing. Check ROADMAP.md first.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
