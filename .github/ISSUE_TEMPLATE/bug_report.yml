name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security problems, do not open an issue: follow SECURITY.md instead.
        Please do not attach images that show anyone's face.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HandCue version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution, desktop and session
      placeholder: "Debian 13, KDE Plasma 6.3, Wayland"
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Webcam model
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [".deb", "pipx / pip", "From source"]
  - type: textarea
    id: log
    attributes:
      label: Activity log
      description: Relevant lines from Preferences > Activity log, or the terminal output.
      render: text
