name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries for OpenCV and Qt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples hatch_build.py
      - name: Test
        run: pytest -q

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: pip install build && python -m build
      - name: The wheel contains the compiled translations
        run: unzip -l dist/*.whl | grep -q "locale/es/LC_MESSAGES/handcue.mo"
      - name: Validate desktop metadata
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
          appstreamcli validate --no-net data/*.metainfo.xml
          desktop-file-validate data/*.desktop
