[build-system]
requires = ["hatchling>=1.25", "babel>=2.14"]
build-backend = "hatchling.build"

[project]
name = "handcue"
dynamic = ["version"]
description = "Control your Linux desktop with hand, face and body gestures from a webcam"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "src/handcue/resources/fonts/OFL.txt"]
authors = [{ name = "Ignacio Aranda" }]
requires-python = ">=3.11"
keywords = ["webcam", "gestures", "mediapipe", "v4l2", "virtual camera", "face recognition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "mediapipe>=0.10.30",
    # mediapipe already pulls opencv-contrib-python; listing it makes the
    # dependency explicit (YuNet and SFace live in OpenCV).
    "opencv-contrib-python>=4.8",
    "numpy>=1.26",
    "PySide6-Essentials>=6.6",
    "QtAwesome>=1.3",
    "jeepney>=0.8",
    "cryptography>=42",
    "SecretStorage>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "babel>=2.14", "build>=1.2", "pip-tools>=7.4"]

[project.scripts]
handcue = "handcue.app:main"

[project.urls]
Homepage = "https://github.com/Ignacio-Aranda/handcue"
Issues = "https://github.com/Ignacio-Aranda/handcue/issues"
Changelog = "https://github.com/Ignacio-Aranda/handcue/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/handcue/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/handcue"]
artifacts = ["src/handcue/locale/**/*.mo"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "src/handcue",
    "po",
    "data",
    "docs",
    "examples",
    "packaging",
    "tests",
    "hatch_build.py",
    "babel.cfg",
    "Makefile",
    "requirements.in",
    "requirements.lock",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "ROADMAP.md",
    "SECURITY.md",
    "LICENSE",
]
exclude = ["src/handcue/locale"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "N", "UP", "SIM", "BLE", "S"]
ignore = [
    "S603",  # subprocess without shell: arguments are lists by design
    "S607",  # partial executable paths (xdg-open, wpctl...) are resolved from PATH on purpose
    "S108",  # /tmp paths only appear in tests
    "S110",  # try/except/pass is used where a failure is harmless (e.g. releasing a button)
    "S112",
    "S311",  # random is only used for visual effects
    "N812",  # `from . import theme as T`
    "SIM105",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"examples/*" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
